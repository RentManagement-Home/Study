    <meta name="description" content="ScholarLog — daily study timetable tracker with live session timers, focus countdowns, backlog analysis, digital wellbeing insights, and consistency tracking." />
    <meta property="og:title" content="ScholarLog" />

    <script>
      (function () {
        try {
          var mode = 'default';
          var accent = 'indigo';
          var rawAuth = localStorage.getItem('daily_study_auth_session_v1') || sessionStorage.getItem('daily_study_auth_session_v1');
          if (rawAuth) {
            var auth = JSON.parse(rawAuth);
            var uid = auth && auth.userId ? String(auth.userId).trim().toLowerCase() : '';
            var uname = auth && auth.username ? String(auth.username).trim().toLowerCase() : '';
            var scope = uid || (uname ? 'user_' + uname : '');
            if (scope) {
              var rawState = localStorage.getItem('daily_study_timetable_pro_v2__' + scope);
              if (rawState) {
                var st = JSON.parse(rawState);
                if (st && st.theme) mode = st.theme;
                if (st && st.accent) accent = st.accent;
              }
            }
          }
          var resolved = mode;
          if (mode === 'default' || !mode) {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolved = prefersDark ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-accent', accent);
          if (resolved === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
